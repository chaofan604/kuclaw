# Harness Studio host extensions layered over the current Desktop profile.

- id: web-fetch-http
  config:
    verifySyntheticDns: true

- insert:
    - id: scheduled-tasks
      name: '@deepseek-ai/dsh-scheduled-tasks'
      disabled: !!js process.env.HARNESS_STUDIO_SCOPE === 'daily'
      inject:
        - sessionController
      config:
        databasePath: !!js dshHomePath('scheduled-tasks.sqlite')
        maxRuntimeMs: 86400000

    - id: scheduled-task-controller
      name: '@deepseek-ai/dsh-api-scheduled-task-controller'
      disabled: !!js process.env.HARNESS_STUDIO_SCOPE === 'daily'
      inject:
        - scheduledTasks
