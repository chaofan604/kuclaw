# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- id: web-fetch-http
  config:
    verifySyntheticDns: true

- insert:
    - id: scheduled-tasks
      name: '@deepseek-ai/dsh-scheduled-tasks'
      disabled: !!js process.env.HARNESS_STUDIO_SCOPE === 'daily'
      inject:
        - sessionController
      config:
        databasePath: !!js dshHomePath('scheduled-tasks.sqlite')
        maxRuntimeMs: 86400000

    - id: scheduled-task-controller
      name: '@deepseek-ai/dsh-api-scheduled-task-controller'
      disabled: !!js process.env.HARNESS_STUDIO_SCOPE === 'daily'
      inject:
        - scheduledTasks

    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
